name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 三个模块各自独立，任何一个挂了不该拖累另外两个。
      matrix:
        module: [sdk, games/uno, hub]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod 里同时写了 go 1.24.2 和 toolchain go1.24.4。
          # 用 1.24.x 直接装最新的补丁版，免得 Go 在 CI 里再去下载 toolchain。
          go-version: '1.26.x'
          # 三个模块的 go.sum 不一样，不按模块分开会让缓存互相覆盖。
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::这些文件没有跑过 gofmt："
            echo "$out"
            exit 1
          fi

      # go mod tidy -diff 在 Go 1.23+ 才有：有差异时退出码非 0，
      # 用来防止"改了依赖忘了提交 go.sum"。
      - name: go.mod 是 tidy 的
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff

      - name: build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # 只有 hub 开 -race：房间、订阅、会话全是并发，值得查；
      # 另外两个模块基本是纯函数，race 检测意义不大但时间翻倍。
      - name: test
        working-directory: ${{ matrix.module }}
        run: |
          if [ "${{ matrix.module }}" = "hub" ]; then
            go test -count=1 -race ./...
          else
            go test -count=1 ./...
          fi

  smoke:
    name: smoke (登录链路)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: hub/go.sum

      # 真起 hub、真用 ssh 敲命令、真拿会话。M0 那条"没有密码"的链路
      # 只要有一步断了，这里就会红。
      - name: 网页登录冒烟
        run: bash hub/scripts/login-smoke.sh

  build:
    name: build (linux/amd64)
    runs-on: ubuntu-latest
    needs: test
    # PR 不出产物，只在 main 上留一份可以直接扔上服务器的二进制。
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: hub/go.sum

      - name: 交叉编译
        working-directory: hub
        env:
          CGO_ENABLED: '0' # 成立的前提是 SQLite 用纯 Go 驱动（modernc.org/sqlite）
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o ../dist/hub-linux-amd64 ./cmd/hub

      - name: 校验产物
        run: |
          file dist/hub-linux-amd64
          test -x dist/hub-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: hub-linux-amd64
          path: dist/hub-linux-amd64
          if-no-files-found: error
