name: Release

# 打 tag 时构建并发布一个 GitHub Release，把二进制作为 release asset 挂上去。
# 服务器上用 deploy/update.sh 轮询最新 tag，直接下载这个资产——不跨境传文件、
# 不在生产机上编译，也不需要往仓库里存任何私钥。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 建 release 需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: hub/go.sum

      - name: 编译 linux/amd64
        working-directory: hub
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o ../dist/hub-linux-amd64 ./cmd/hub
          file ../dist/hub-linux-amd64
          ( cd ../dist && sha256sum hub-linux-amd64 > hub-linux-amd64.sha256 )
          cat ../dist/hub-linux-amd64.sha256

      # 资产名必须固定，服务器靠固定 URL 下载：
      # https://github.com/<owner>/<repo>/releases/download/<tag>/hub-linux-amd64
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在，补传资产"
            gh release upload "$TAG" dist/hub-linux-amd64 dist/hub-linux-amd64.sha256 --clobber
          else
            gh release create "$TAG" \
              dist/hub-linux-amd64 dist/hub-linux-amd64.sha256 \
              --title "$TAG" \
              --generate-notes
          fi

      - name: 校验资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
