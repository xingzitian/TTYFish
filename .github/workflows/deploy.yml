name: Deploy

# 只部署同一 main CI run 生成并验证过的产物，不重新构建、不创建 Release。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    name: 部署已通过 CI 的产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: ttyfish-binaries
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/download-artifact@v4
        with:
          name: ttyfish-web
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: 校验并打包 CI 产物
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check hub-linux-amd64.sha256 backend-linux-amd64.sha256
          sha256sum --check web.tar.gz.sha256
          tar -tzf web.tar.gz >/dev/null
          TAG="deploy-${COMMIT:0:12}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          tar -czf "$RUNNER_TEMP/ttyfish-deploy.tar.gz" .

      - name: 部署 CI 产物
        env:
          SSH_KEY: ${{ secrets.TTYFISH_DEPLOY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: c7271c3053a80ea7bf1206cbb25cf45e
          R2_BUCKET: ttyfish
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/k
          printf '\n' >> ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -H 159.75.78.7 >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH=(ssh -i "$HOME/.ssh/k" -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 deploy@159.75.78.7)
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          OBJECT_KEY="deploy/${COMMIT}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/ttyfish.tar.gz"
          BUNDLE="$RUNNER_TEMP/ttyfish-deploy.tar.gz"
          BUNDLE_SHA256="$(sha256sum "$BUNDLE" | cut -d' ' -f1)"

          "${SSH[@]}" 'cat > /opt/ttyfish/deploy.sh && chmod 755 /opt/ttyfish/deploy.sh' < deploy/deploy.sh
          aws s3 cp "$BUNDLE" "s3://${R2_BUCKET}/${OBJECT_KEY}" \
            --endpoint-url "$ENDPOINT" --region auto --only-show-errors
          PRESIGNED_URL="$(aws s3 presign "s3://${R2_BUCKET}/${OBJECT_KEY}" \
            --endpoint-url "$ENDPOINT" --region auto --expires-in 900)"
          echo "::add-mask::$PRESIGNED_URL"
          printf '%s\n' "$PRESIGNED_URL" |
            "${SSH[@]}" "/opt/ttyfish/deploy.sh $TAG $BUNDLE_SHA256 $R2_ACCOUNT_ID $R2_BUCKET -"

      - name: 部署后确认
        run: |
          ssh -i "$HOME/.ssh/k" -o IdentitiesOnly=yes -o BatchMode=yes deploy@159.75.78.7 \
            'systemctl is-active ttyfish; cat /opt/ttyfish/.version 2>/dev/null; curl -skL --max-time 5 -o /dev/null -w "web=%{http_code}\n" http://127.0.0.1:12332/'
