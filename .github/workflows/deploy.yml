name: Release & Deploy

# 打 tag 时：构建 → 发布 Release（挂二进制资产）→ 通过 SSH 让服务器下载并切换。
#
# 为什么不是 CI 直接把 15MB 二进制 scp 过去：这条跨境链路只有几十 KB/s，
# 传一次要十几分钟。让服务器自己从 Release 下载（走本机 mihomo）是秒级的。
#
# 为什么不用定时轮询：CI 已经能连上机器了，没必再多一条"谁先发现"的链路。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.3）'
        required: true

permissions:
  contents: write # 建 release 需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 发布 ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: hub/go.sum

      # 两个二进制：后端（账号+房间+规则）和 SSH 网关
      - name: 编译 linux/amd64
        working-directory: hub
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o ../dist/hub-linux-amd64 ./cmd/hub
          go build -trimpath -ldflags "-s -w" -o ../dist/backend-linux-amd64 ./cmd/backend
          file ../dist/hub-linux-amd64 ../dist/backend-linux-amd64
          cd ../dist
          sha256sum hub-linux-amd64 > hub-linux-amd64.sha256
          sha256sum backend-linux-amd64 > backend-linux-amd64.sha256
          cat *.sha256

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS="dist/hub-linux-amd64 dist/hub-linux-amd64.sha256 dist/backend-linux-amd64 dist/backend-linux-amd64.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release 已存在，补传资产"
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS --title "$TAG" --generate-notes
          fi

      # 服务器侧脚本由 CI 推过去（4KB，不是 15MB），再执行。
      # 这样服务器上不用预先装任何东西，脚本改了也跟着走。
      - name: 部署到服务器
        env:
          SSH_KEY: ${{ secrets.TTYFISH_DEPLOY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # secret 里的私钥可能带着 Windows 的 \r，ssh 对此很敏感
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/k
          printf '\n' >> ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keygen -lf ~/.ssh/k

          ssh-keyscan -H 159.75.78.7 >> ~/.ssh/known_hosts 2>/dev/null || true
          S="ssh -i $HOME/.ssh/k -p 22 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 deploy@159.75.78.7"

          echo "--- 上传部署脚本 ---"
          $S 'cat > /opt/ttyfish/deploy.sh && chmod 755 /opt/ttyfish/deploy.sh' < deploy/deploy.sh

          echo "--- 执行部署 ---"
          $S "/opt/ttyfish/deploy.sh $TAG"

      - name: 部署后确认
        env:
          SSH_KEY: ${{ secrets.TTYFISH_DEPLOY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/k
          printf '\n' >> ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh-keyscan -H 159.75.78.7 >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i "$HOME/.ssh/k" -o IdentitiesOnly=yes -o BatchMode=yes deploy@159.75.78.7 \
            'systemctl is-active ttyfish; cat /opt/ttyfish/.version 2>/dev/null; curl -s --max-time 3 http://127.0.0.1:12332/healthz; echo'
